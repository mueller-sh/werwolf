<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Werwolf 3.0</title>
<style>
:root{--b:#0b1020;--p:#172033;--p2:#202d45;--l:#3b4a66;--t:#f5f7fb;--m:#aab6c9;--a:#8b5cf6;--g:#16a34a;--r:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:12px 16px;background:#080d19;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:2}h1{margin:0;font-size:19px}.sub{color:var(--m);font-size:12px}main{max-width:1100px;margin:auto;padding:12px}.box{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:12px}button,select{font:inherit;background:#0e1627;color:var(--t);border:1px solid var(--l);border-radius:9px;padding:9px 11px}button{background:var(--a);border:0;font-weight:700}button.secondary{background:#344258}button:disabled{opacity:.4}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.phase{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:var(--p2);border:2px solid transparent;border-radius:11px;padding:9px;min-height:92px}.card.sel{border-color:var(--a);background:#33265f}.card.dead{opacity:.4}.num{font-size:20px;font-weight:800}.role{font-size:12px}.tag{display:inline-block;background:#354257;padding:2px 5px;border-radius:5px;margin:3px 2px 0 0;font-size:10px}.wolf{background:#642938}.dorf{background:#17603d}.msg{background:#0e1627;padding:10px;border-radius:9px;margin-bottom:10px;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tabs button{background:#344258;white-space:nowrap}.tabs .on{background:var(--a)}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px;border-bottom:1px solid var(--l);text-align:left}.log{white-space:pre-wrap;background:#080d18;padding:10px;border-radius:8px;max-height:400px;overflow:auto;font:11px monospace}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){main{padding:8px}}
</style></head><body>
<header><h1>🐺 Werwolf 3.0</h1><div class="sub">Interaktive Spielleitung · Testversion</div></header>
<main>
<div class="box toolbar"><label>Spieler <select id="cnt"><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option></select></label><label>Tempo <select id="spd"><option value="45">45 Minuten</option><option value="90">90 Minuten</option><option value="classic">Klassisch</option></select></label><button onclick="newGame()">Neue Partie</button><button class="secondary" onclick="loadGame()">Laden</button><button class="secondary" onclick="exportGame()">Export</button></div>
<div class="box phase"><div><b id="phase">Keine Partie</b><div class="sub" id="hint">Neue Partie starten.</div></div><b id="alive">–</b></div>
<div class="box"><div class="tabs"><button id="tm" class="on" onclick="view('m')">Moderation</button><button id="tp" onclick="view('p')">Spielübersicht</button><button id="tl" onclick="view('l')">Protokoll</button></div><div id="m"></div><div id="p" style="display:none"></div><div id="l" style="display:none"></div></div>
</main>
<script>
let G=null,sel=new Set();
const W=['Werwolf','Urwolf','Großer böser Wolf','Weißer Wolf'];
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=n=>G.players[n-1], isW=r=>W.includes(r);
function roles(n){
  // Verbindlicher Rollenstandard, 10–28 Spieler.
  // Wolfsstaffel:
  // 10: 2 WW
  // 11–13: 2 WW + Wolfshund
  // 14–17: 2 WW + Wolfshund + Urwolf
  // 18–21: + Weißer Wolf
  // 22–27: + Großer böser Wolf
  // 28: zusätzlich 1 regulärer Werwolf
  let wolves;
  if(n<=10) wolves=['Werwolf','Werwolf'];
  else if(n<=13) wolves=['Werwolf','Werwolf','Wolfshund'];
  else if(n<=17) wolves=['Werwolf','Werwolf','Wolfshund','Urwolf'];
  else if(n<=21) wolves=['Werwolf','Werwolf','Wolfshund','Urwolf','Weißer Wolf'];
  else if(n<=27) wolves=['Werwolf','Werwolf','Wolfshund','Urwolf','Weißer Wolf','Großer böser Wolf'];
  else wolves=['Werwolf','Werwolf','Werwolf','Wolfshund','Urwolf','Weißer Wolf','Großer böser Wolf'];

  // Sonderrollen nach der verbindlichen Priorität.
  // Zwei Schwestern sind zwei Karten und werden immer gemeinsam vergeben.
  let specials=['Seherin','Hexe','Amor','Fuchs','Jäger','Kleines Mädchen'];
  if(n>=14) specials.push('Wildes Kind');
  if(n>=18) specials.push('Alter Mann','Ritter der rostigen Klinge','Zwei Schwestern','Zwei Schwestern');
  if(n>=22) specials.push('Flötenspieler');

  let a=[...wolves,...specials];
  while(a.length<n) a.push('Dorfbewohner');

  // Bei 10–28 passt die Verteilung exakt: keine einzelne Schwester.
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
const S1=[['Amor','Wähle zwei Verliebte'],['Wildes Kind','Wähle das Vorbild'],['Wolfshund','Lager festlegen'],['Seherin','Eine Person prüfen'],['Fuchs','Mitte einer Dreiergruppe wählen'],['Werwölfe','Wolfsopfer wählen'],['Urwolf','Optional: Opfer infizieren'],['Großer böser Wolf','Optional: Zusatzopfer'],['Hexe','Heilen oder vergiften'],['Weißer Wolf','Gerade Nächte: anderen Wolf wählen'],['Flötenspieler','Bis zu zwei verzaubern'],['Tagesbeginn','Nacht abwickeln']];
const SN=[['Seherin','Ergebnis direkt anzeigen – keine Auswahl'],['Fuchs','Mitte einer Dreiergruppe wählen'],['Werwölfe','Wolfsopfer wählen'],['Urwolf','Optional: Opfer infizieren'],['Großer böser Wolf','Optional: Zusatzopfer'],['Hexe','Heilen oder vergiften'],['Weißer Wolf','Gerade Nächte: anderen Wolf wählen'],['Flötenspieler','Bis zu zwei verzaubern'],['Tagesbeginn','Nacht abwickeln']];
function newGame(){let n=+cnt.value,r=roles(n);G={n,speed:spd.value,night:1,day:0,step:0,phase:'night',pending:[],hist:[],log:[],players:r.map((role,i)=>({n:i+1,role,lager:isW(role)?'Wolf':role==='Flötenspieler'?'Einzelgänger':'Dorf',alive:true,verliebt:null,vorbild:null,verzaubert:false,status:[]}))};sel.clear();let sisters=G.players.filter(x=>x.role==='Zwei Schwestern');if(sisters.length===2){sisters[0].status.push('Schwester von '+sisters[1].n);sisters[1].status.push('Schwester von '+sisters[0].n);note('👭 Zwei Schwestern: '+sisters[0].n+' und '+sisters[1].n)}note('Neue Partie gestartet');save();render()}
function steps(){return G.night===1?S1:SN}function cur(){return steps()[G.step]||['Tagesbeginn','Nacht abwickeln']}
function need(n){if(n==='Amor'||n==='Zwei Schwestern')return 2;if(n==='Werwölfe')return G.speed==='45'?(G.night===1?1:G.night<=3?2:G.night<=6?3:4):1;if(n==='Flötenspieler')return 2;return 1}
function elig(name){let a=G.players.filter(x=>x.alive);if(name==='Werwölfe')return a.filter(x=>x.lager==='Dorf');if(name==='Urwolf')return G.pending.filter(x=>x.type==='wolf'&&P(x.target)?.alive).map(x=>P(x.target));if(name==='Großer böser Wolf')return a.filter(x=>x.lager==='Dorf'&&!G.pending.some(y=>y.target===x.n));if(name==='Weißer Wolf')return a.filter(x=>x.lager==='Wolf'&&x.role!=='Weißer Wolf');if(name==='Flötenspieler')return a.filter(x=>!x.verzaubert&&x.role!=='Flötenspieler');return a}
function card(x,name){let ok=x.alive&&!(name==='Seherin'&&G.night>=2)&&elig(name).some(y=>y.n===x.n),tags=[x.alive?'lebend':'tot',x.lager];if(x.verliebt)tags.push('❤️ '+x.verliebt);if(x.vorbild)tags.push('Vorbild: '+x.vorbild);if(x.verzaubert)tags.push('verzaubert');return '<div class="card '+(sel.has(x.n)?'sel ':'')+(!x.alive?'dead':'')+'" onclick="'+(ok?'pick('+x.n+')':'')+'"><div class="num">'+x.n+'</div><div class="role">'+esc(x.role)+'</div>'+tags.map(t=>'<span class="tag '+(t==='Wolf'?'wolf':t==='Dorf'?'dorf':'')+'">'+esc(t)+'</span>').join('')+'</div>'}
function render(){if(!G){m.innerHTML='<div class="msg">Neue Partie starten.</div>';return}let[n,h]=cur();phase.textContent=(G.phase==='night'?'Nacht '+G.night:'Tag '+G.day)+' · '+n;hint.textContent=h;alive.textContent=G.players.filter(x=>x.alive).length;let extra=n==='Seherin'&&G.night>=2?'<div class="msg">🔮 Seherin: Ergebnis wird automatisch angezeigt; keine Auswahl.</div>':n==='Tagesbeginn'?'<div class="msg">☀️ Nachtopfer und Todesketten werden jetzt abgewickelt.</div>':'';let k=need(n),ok=n==='Tagesbeginn'||(n==='Seherin'&&G.night>=2)||sel.size===k;m.innerHTML='<div class="grid">'+G.players.map(x=>card(x,n)).join('')+'</div>'+extra+'<div class="actions"><button onclick="confirmAction()" '+(ok?'':'disabled')+'>'+(n==='Tagesbeginn'?'Nacht abwickeln':'Bestätigen ('+sel.size+'/'+k+')')+'</button><button class="secondary" onclick="skip()">Überspringen</button><button class="secondary" onclick="undo()">↶ Rückgängig</button></div>';p.innerHTML=table();l.innerHTML='<div class="log">'+esc(G.log.join('\n'))+'</div>'}
function pick(n){let[nm]=cur(),k=need(nm);if(sel.has(n))sel.delete(n);else if(sel.size<k)sel.add(n);render()}
function snap(){G.hist.push(JSON.stringify(G));if(G.hist.length>30)G.hist.shift()}
function confirmAction(){let[nm]=cur(),c=[...sel];snap();if(nm==='Amor'){P(c[0]).verliebt=c[1];P(c[1]).verliebt=c[0]}else if(nm==='Wildes Kind'){let q=G.players.find(x=>x.role==='Wildes Kind'&&x.alive);if(q)q.vorbild=c[0]}else if(nm==='Werwölfe')c.forEach(n=>G.pending.push({type:'wolf',target:n}));else if(nm==='Urwolf'&&c[0]){G.pending=G.pending.filter(x=>x.target!==c[0]);P(c[0]).lager='Wolf';P(c[0]).status.push('infiziert')}else if(nm==='Großer böser Wolf'&&c[0])G.pending.push({type:'bigwolf',target:c[0]});else if(nm==='Weißer Wolf'&&c[0])G.pending.push({type:'whitewolf',target:c[0]});else if(nm==='Flötenspieler')c.forEach(n=>P(n).verzaubert=true);else if(nm==='Tagesbeginn'){resolveNight();sel.clear();return}note(nm+': '+(c.join(', ')||'übersprungen'));sel.clear();G.step=Math.min(G.step+1,steps().length-1);save();render()}
function resolveNight(){let d=[...new Set(G.pending.map(x=>x.target))];G.pending=[];d.forEach(n=>{if(P(n)?.alive){P(n).alive=false;note('☠ '+n+' stirbt')}});G.players.filter(x=>!x.alive&&x.verliebt).forEach(x=>{let q=P(x.verliebt);if(q?.alive){q.alive=false;note('❤️ Liebeskummer: '+q.n)}});G.day++;G.night++;G.phase='day';G.step=0;save();render()}
function skip(){snap();note('Übersprungen: '+cur()[0]);if(cur()[0]==='Tagesbeginn')resolveNight();else{sel.clear();G.step=Math.min(G.step+1,steps().length-1);save();render()}}
function undo(){if(!G?.hist.length)return;G=JSON.parse(G.hist.pop());sel.clear();save();render()}
function note(x){G.log.push(new Date().toLocaleTimeString('de-DE')+' – '+x)}
function save(){localStorage.setItem('werwolf30',JSON.stringify(G))}
function loadGame(){let x=localStorage.getItem('werwolf30');if(x){G=JSON.parse(x);sel.clear();render()}}
function exportGame(){if(!G)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(G,null,2)],{type:'application/json'}));a.download='werwolf-spielstand.json';a.click()}
function table(){return '<div style="overflow:auto"><table><tr><th>#</th><th>Rolle</th><th>Lager</th><th>Status</th></tr>'+G.players.map(x=>'<tr><td>'+x.n+'</td><td>'+esc(x.role)+'</td><td>'+x.lager+'</td><td>'+(x.alive?'lebend':'tot')+(x.verliebt?' · ❤️ '+x.verliebt:'')+(x.vorbild?' · Vorbild: '+x.vorbild:'')+(x.verzaubert?' · verzaubert':'')+'</td></tr>').join('')+'</table></div>'}
function view(x){['m','p','l'].forEach(y=>{document.getElementById(y).style.display=y===x?'block':'none';document.getElementById('t'+y).classList.toggle('on',y===x)});render()}render();
</script></body></html>
